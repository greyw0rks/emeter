[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "../circuit/artifacts" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false

[rpc_endpoints]
xlayer = "${X_LAYER_RPC_URL}"
